[project]
name = "sport-agent-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0.36",
    "pyodbc>=5.2",
    "pydantic-settings>=2.7",
    "itsdangerous>=2.2",
    "garminconnect>=0.3.16,<0.4",
    "curl_cffi>=0.15",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "python-dotenv>=1.2.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
